# Cloudflare Pages + D1 configuration.
#
# 1. Create the D1 database:      pnpm exec wrangler d1 create nuxtcms
# 2. Paste the returned database_id below.
# 3. Apply schema to D1:          pnpm run db:migrate:remote
# 4. Build + deploy:              pnpm run deploy
#
# The Nuxt server reads this binding as event.context.cloudflare.env.DB.

name = "tbseo"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat_v2"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "tbseo"
database_id = "b8bd89ac-2760-43e6-9cb3-7bd5ee5675b2"
migrations_dir = "node_modules/nuxtcms/server/database/migrations"

# R2 bucket for media/attachments.
# Create it once with:  pnpm exec wrangler r2 bucket create nuxtcms-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tbseo"
